name: 🐞 反馈一个问题
description: 软件出错了、行为不对、下载失败、崩溃等
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你来反馈！🙏

        **填得越清楚，修得越快。** 下面每项都有说明，照着填就行，不需要懂技术。

        > 如果只是想问「怎么用」，请改用「❓ 安装 / 使用求助」模板。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 在扩展面板底部能看到；或打开 `%LOCALAPPDATA%\FDMHelper\version.json` 看 `version` 字段
      placeholder: 例如 2.13.2
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题属于哪一类？
      options:
        - 下载失败 / 下到一半断了
        - 视频页没有出现「下载视频」按钮
        - 画质列表是空的 / 不对
        - 进度、速度显示不对
        - 批量下载（合集 / 主页）有问题
        - 软件崩溃 / 闪退
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 具体发生了什么？
      description: 用你自己的话描述就行。可以附上截图（直接拖进输入框就能上传）。
      placeholder: |
        例如：我打开一个视频页，点了下载视频按钮，选 1080P，然后进度条一直卡在「解析中」不动，等了五分钟也没开始。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果是什么？
      placeholder: 例如：应该开始下载，并且速度有数字在跳。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么才能重现这个问题？
      description: 越具体越好。如果每次都出现，请写「每次都有」；如果偶尔出现，写大概几次里有一次。
      placeholder: |
        1. 打开哪一类网页（是 B站 / YouTube / 还是某个具体网址）
        2. 点了什么按钮
        3. 屏幕上出现了什么
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志（如果有）
      description: |
        打开 `%LOCALAPPDATA%\FDMHelper\` 目录，里面有个 `.log` 文件。
        **把最后 30 行左右复制粘贴到这里**（不需要全部）。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前请确认
      options:
        - label: 我已经装了「悬浮下载助手」本机程序（不只是浏览器扩展）
          required: true
        - label: 我打开过 http://127.0.0.1:17890/ping ，并能看到一段内容
          required: true
        - label: 我已经看过 README 里的常见问题
          required: false
